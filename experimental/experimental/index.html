<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#102a43">
<link rel="manifest" href="manifest.webmanifest">
<title>Scanner Experimental v0.2.2</title>
<style>
:root{--bg:#071521;--panel:#102a43;--panel2:#0b2135;--line:#31566f;--ok:#2bd576;--sample:#ffcf5c;--text:#f7fbff;--muted:#b9cad8}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{overflow:hidden}.app{height:100%;display:grid;grid-template-rows:auto minmax(210px,1fr) auto}
header{padding:10px 14px;background:linear-gradient(180deg,#102a43,#0b2135);display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:17px;margin:0}header small{display:block;color:var(--muted)}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#183e5d;color:var(--muted);white-space:nowrap}
.viewer{position:relative;background:#000;min-height:0;overflow:hidden}video{width:100%;height:100%;object-fit:cover;background:#000}
.overlay{position:absolute;inset:0;pointer-events:none}.scanbox{position:absolute;left:7%;right:7%;height:23%;top:50%;transform:translateY(-50%);border:2px solid #fff;border-radius:14px;box-shadow:0 0 18px rgba(255,255,255,.15)}
.scanline{position:absolute;left:5%;right:5%;top:50%;height:2px;background:linear-gradient(90deg,transparent,var(--ok),transparent);box-shadow:0 0 8px var(--ok);animation:sweep 1.4s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-38px)}to{transform:translateY(38px)}}
.controls{background:var(--panel2);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;gap:8px;max-height:52vh;overflow:auto}
.row{display:flex;gap:7px;align-items:center}.grow{flex:1;min-width:0}button,input{font:inherit}
button{border:0;border-radius:11px;background:#183e5d;color:white;padding:10px 12px;font-weight:650}button.primary{background:#1a73e8}button.sample{background:#7a651f}button.active{outline:2px solid #d8edff;background:#245777}button:disabled{opacity:.45}
input[type=text]{width:100%;background:#132f49;color:white;border:1px solid #345a75;border-radius:9px;padding:10px}input[type=file]{display:none}input[type=range]{width:100%}
label{font-size:12px;color:var(--muted)}.fileBtn{display:block;text-align:center;border-radius:11px;background:#183e5d;color:white;padding:10px 12px;font-weight:650}
.result{border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:#0d263b;min-height:58px}.result strong{display:block;font-size:17px;word-break:break-all}.meta,.status{font-size:12px;color:var(--muted);margin-top:4px}
.history{border:1px solid var(--line);border-radius:12px;background:#0d263b;overflow:hidden}.historyHead{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.historyList{max-height:150px;overflow:auto}.empty{padding:12px;color:var(--muted);font-size:13px;text-align:center}
.item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid rgba(49,86,111,.6);font-variant-numeric:tabular-nums}.item:last-child{border-bottom:0}
.item.sampled{background:rgba(255,207,92,.14);box-shadow:inset 4px 0 0 var(--sample)}.code{font-weight:750;word-break:break-all}.key{margin-left:auto;color:var(--muted);font-weight:650;white-space:nowrap}.camera{display:none}.item.sampled .camera{display:inline}
.services{border:1px solid var(--line);border-radius:12px;background:#0d263b;overflow:hidden}
.servicesHead{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.servicesList{max-height:145px;overflow:auto}.serviceRow{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;padding:7px 9px;border-bottom:1px solid rgba(49,86,111,.6)}
.serviceRow:last-child{border-bottom:0}.serviceRow input[type=text]{padding:8px}.serviceRow.active{background:rgba(43,213,118,.1);box-shadow:inset 4px 0 0 var(--ok)}
.mini{padding:8px 10px}.flash{animation:flash .35s}@keyframes flash{50%{box-shadow:inset 0 0 0 6px var(--ok)}}@media(min-width:800px){.app{max-width:720px;margin:auto;border-inline:1px solid #244761}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Scanner Experimental v0.2.2</h1><small>Nativo · ingreso manual · múltiples servicios</small></div><span class="badge" id="engineBadge">Sin iniciar</span></header>
<main class="viewer" id="viewer"><video id="video" playsinline muted></video><div class="overlay"><div class="scanbox"><div class="scanline"></div></div></div></main>
<section class="controls">
  <div class="row">
    <label class="fileBtn grow" for="excelFiles">Agregar Excel</label>
    <input id="excelFiles" type="file" accept=".xlsx,.xls,.xlsm" multiple>
    <button id="toggleServices">Servicios</button>
  </div>
  <div class="services" id="servicesPanel">
    <div class="servicesHead"><strong>Servicios cargados</strong><span id="serviceCount">0</span></div>
    <div class="servicesList" id="servicesList"><div class="empty">Carga uno o varios Excel.</div></div>
  </div>

  <div class="row">
    <input id="manualCode" class="grow" type="text"
      placeholder="Escribir o pegar código"
      autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button id="verifyManual" class="primary">Verificar</button>
  </div>

  <div class="row"><button id="torch" disabled>🔦 Linterna</button><div class="grow"><label>Zoom: <span id="zoomValue">1.0×</span></label><input id="zoom" type="range" min="1" max="1" step="0.1" value="1" disabled></div></div>
  <div class="result"><strong id="value">Sin lectura</strong><div class="meta" id="meta">Ingresa la clave y apunta hacia un código.</div></div>
  <div class="row"><button id="start" class="primary grow">Iniciar cámara</button><button id="sample" class="sample" disabled>📷 Muestra</button><button id="clearCurrent">Limpiar</button></div>
  <div class="history"><div class="historyHead"><strong>Histórico</strong><span id="count">0</span></div><div class="historyList" id="history"><div class="empty">Aún no hay lecturas.</div></div></div>
  <div class="row"><button id="clearHistory" class="grow">Vaciar histórico</button></div>
  <div class="status" id="status">La cámara requiere HTTPS o GitHub Pages.</div>
</section>
</div>
<script>
const $=s=>document.querySelector(s),video=$('#video'),statusEl=$('#status'),badge=$('#engineBadge');
let stream=null,track=null,running=false,torchOn=false,detector=null,timer=0,lastAccepted='',lastAt=0,currentCode='';
let services=[],activeServiceId=null;
const records=[],formats=['code_128','code_39','code_93','codabar','ean_13','ean_8','itf','upc_a','upc_e'];
function setStatus(t){statusEl.textContent=t}
function serviceKey(){
  const s=services.find(x=>x.id===activeServiceId);
  return s?.key?.trim()||'';
}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderServices(){
  $('#serviceCount').textContent=services.length;
  const box=$('#servicesList');
  if(!services.length){
    box.innerHTML='<div class="empty">Carga uno o varios Excel.</div>';
    return;
  }
  box.innerHTML=services.map(s=>`<div class="serviceRow ${s.id===activeServiceId?'active':''}">
    <input class="serviceRadio" type="radio" name="activeService" data-id="${s.id}" ${s.id===activeServiceId?'checked':''}>
    <div><input class="serviceInput" data-id="${s.id}" type="text" value="${esc(s.key)}"><div class="meta">${esc(s.fileName)}</div></div>
    <button class="removeService mini" data-id="${s.id}">✕</button>
  </div>`).join('');
}
function addFiles(files){
  for(const file of files){
    const id=crypto.randomUUID?.()||String(Date.now())+Math.random();
    services.push({id,fileName:file.name,key:file.name.replace(/\.[^.]+$/,'')});
    if(!activeServiceId)activeServiceId=id;
  }
  renderServices();
  setStatus(`${files.length} archivo(s) agregado(s). Selecciona el servicio activo.`);
}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(1250,c.currentTime);g.gain.setValueAtTime(.65,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.2);setTimeout(()=>c.close(),300)}catch(e){}}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){const h=$('#history');$('#count').textContent=records.length;if(!records.length){h.innerHTML='<div class="empty">Aún no hay lecturas.</div>';return}h.innerHTML=records.map((r,i)=>`<div class="item ${r.sample?'sampled':''}" data-i="${i}"><span class="camera">📷</span><span class="code">${escapeHtml(r.code)}</span><span class="key">${escapeHtml(r.key)}</span></div>`).join('');h.scrollTop=0}
function accept(code){if(!code)return;const key=serviceKey();if(!key){setStatus('Escribe primero la clave del servicio.');return}const now=Date.now();if(code===lastAccepted&&now-lastAt<1800)return;lastAccepted=code;lastAt=now;currentCode=code;records.unshift({code,key,sample:false});$('#value').textContent=code;$('#meta').textContent=key;$('#sample').disabled=false;$('#sample').textContent='📷 Muestra';render();beep();$('#viewer').classList.remove('flash');void $('#viewer').offsetWidth;$('#viewer').classList.add('flash')}

function normalizeCode(v){
  return String(v ?? '')
    .trim()
    .toUpperCase()
    .replace(/[\s\-_.\/]+/g,'')
    .replace(/[^A-Z0-9]/g,'');
}
function verifyManual(){
  const input=$('#manualCode');
  const code=normalizeCode(input.value);
  if(!code){
    setStatus('Escribe o pega un código.');
    input.focus();
    return;
  }
  accept(code);
  input.value='';
  input.focus();
}

const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
function capture(){const vw=video.videoWidth,vh=video.videoHeight;if(!vw||!vh)return video;const x=vw*.04,y=vh*.36,w=vw*.92,h=vh*.28,scale=1.35;canvas.width=Math.max(480,Math.round(w*scale));canvas.height=Math.max(180,Math.round(h*scale));ctx.drawImage(video,x,y,w,h,0,0,canvas.width,canvas.height);return canvas}
async function setupDetector(){if(!('BarcodeDetector' in window))throw new Error('Motor nativo BarcodeDetector no disponible');const supported=await BarcodeDetector.getSupportedFormats();const usable=formats.filter(f=>supported.includes(f));detector=new BarcodeDetector(usable.length?{formats:usable}:undefined);return usable.length}
async function loop(){if(!running||!detector)return;try{const found=await detector.detect(capture());if(found?.length)accept(found[0].rawValue)}catch(e){}timer=setTimeout(loop,100)}
function capabilities(){const c=track?.getCapabilities?.()||{},z=$('#zoom');if(c.zoom){z.min=c.zoom.min;z.max=c.zoom.max;z.step=c.zoom.step||.1;z.value=c.zoom.min;z.disabled=false;$('#zoomValue').textContent=Number(z.value).toFixed(1)+'×'}else z.disabled=true;$('#torch').disabled=!c.torch}
async function stop(){running=false;clearTimeout(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;track=null;video.srcObject=null;$('#start').textContent='Iniciar cámara';badge.textContent='Detenido'}
async function start(){if(!serviceKey()){setStatus('Carga o selecciona primero un servicio.');$('#servicesPanel').style.display='block';return}await stop();setStatus('Solicitando cámara trasera…');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},audio:false});video.srcObject=stream;await video.play();track=stream.getVideoTracks()[0];const n=await setupDetector();running=true;capabilities();badge.textContent='Motor nativo';$('#start').textContent='Detener';setStatus(`${track.label||'Cámara trasera'} · ${n} formatos`);loop()}catch(e){running=false;badge.textContent='Error';setStatus('No se pudo iniciar: '+e.message)}}
$('#excelFiles').onchange=e=>{const files=[...e.target.files];if(files.length)addFiles(files);e.target.value=''};
$('#toggleServices').onclick=()=>{$('#servicesPanel').style.display=$('#servicesPanel').style.display==='none'?'block':'none'};
$('#servicesList').oninput=e=>{
  if(e.target.classList.contains('serviceInput')){
    const s=services.find(x=>x.id===e.target.dataset.id);
    if(s)s.key=e.target.value;
  }
};
$('#servicesList').onclick=e=>{
  const id=e.target.dataset.id;
  if(e.target.classList.contains('serviceRadio')){
    activeServiceId=id;renderServices();setStatus(`Servicio activo: ${serviceKey()}`);
  }
  if(e.target.classList.contains('removeService')){
    services=services.filter(x=>x.id!==id);
    if(activeServiceId===id)activeServiceId=services[0]?.id||null;
    renderServices();
    setStatus('Servicio retirado.');
  }
};

$('#verifyManual').onclick=verifyManual;
$('#manualCode').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    verifyManual();
  }
});

$('#start').onclick=()=>running?stop():start();
$('#torch').onclick=async()=>{if(!track)return;torchOn=!torchOn;try{await track.applyConstraints({advanced:[{torch:torchOn}]});$('#torch').classList.toggle('active',torchOn)}catch(e){setStatus('Linterna no disponible')}};
$('#zoom').oninput=async e=>{const v=Number(e.target.value);$('#zoomValue').textContent=v.toFixed(1)+'×';try{await track.applyConstraints({advanced:[{zoom:v}]})}catch(e){}};
$('#sample').onclick=()=>{const r=records.find(x=>x.code===currentCode&&x.key===serviceKey());if(!r)return;r.sample=!r.sample;render();$('#sample').textContent=r.sample?'✓ Muestra':'📷 Muestra';setStatus(r.sample?'Código marcado como muestra.':'Marca de muestra retirada.')};
$('#clearCurrent').onclick=()=>{currentCode='';lastAccepted='';$('#value').textContent='Sin lectura';$('#meta').textContent='Ingresa la clave y apunta hacia un código.';$('#sample').disabled=true;$('#sample').textContent='📷 Muestra'};
$('#clearHistory').onclick=()=>{records.length=0;currentCode='';lastAccepted='';render();$('#value').textContent='Sin lectura';$('#meta').textContent='Ingresa la clave y apunta hacia un código.';$('#sample').disabled=true;$('#sample').textContent='📷 Muestra';setStatus('Histórico vaciado.')};
window.addEventListener('beforeunload',stop);if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
